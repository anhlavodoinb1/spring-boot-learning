# Application Properties for BIDV-BSC Deposit Certificate Service

# Server configuration
server.port=8080
server.servlet.context-path=/api

# Database configuration (H2 for demo)
spring.datasource.url=jdbc:h2:mem:depositcert
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.me.loda.spring.depositcert=DEBUG
logging.level.org.springframework.retry=DEBUG

# Business configuration
depositcert.retry.max-attempts=3
depositcert.retry.delay=1000
depositcert.core-banking.timeout=5000
depositcert.bsc.timeout=3000